{{define "system.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{esc .Title}} - ProjectWikit</title>

    <link rel="stylesheet" type="text/css" href="{{.Asset "fontawesome/css/all.css"}}">
    <link rel="stylesheet" type="text/css" href="{{.Asset "wikidot-base.css"}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="{{.Asset "app.js"}}" type="text/javascript"></script>
    <link rel="stylesheet" type="text/css" href="{{.Asset "system.css"}}">
    <link rel="stylesheet" type="text/css" href="{{.Asset "wikit-tokens.css"}}">
    <link rel="stylesheet" type="text/css" href="{{.Asset "wikit-shell.css"}}">

    
</head>
<body class="system {{.BodyClass}}">
    <div class="system-container">
        {{if .BackLink}}<a class="back-link" href="/"><span class="fa fa-arrow-left"></span> {{.T "system.back-home"}}</a>
        {{end}}
        <div class="system-content">
            {{.Before}}
            <div class="heading">
                <h1 id="title">{{esc .Heading}}</h1>
            </div>
            <div class="content">
                {{.Content}}
            </div>
        </div>
    </div>
    <div id="w-modals"></div>
</body>
</html>
{{end}}
