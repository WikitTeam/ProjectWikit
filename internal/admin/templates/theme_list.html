{{define "theme_list.html"}}
<div class="admin-list">
  <p class="action-row"><a class="btn-primary" href="{{esc .New}}">+</a></p>
  <table class="admin-table">
    <thead><tr><th>name</th><th>slug</th><th>mode</th><th>updated</th></tr></thead>
    <tbody>
      {{range .Themes}}
      <tr>
        <td><a href="{{esc $.Base}}{{.ID}}">{{esc .Name}}</a></td>
        <td><code>{{esc .Slug}}</code></td>
        <td>{{esc .Mode}}</td>
        <td>{{.UpdatedAt.Format "2006-01-02 15:04"}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
