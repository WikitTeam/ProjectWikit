{{define "forum_category_form.html"}}
<form method="POST" action="{{esc .Action}}" class="admin-form">
  <input type="hidden" name="csrfmiddlewaretoken" value="{{esc .CSRF}}">
  {{if .Error}}<div class="error-inline"><span class="marker">ERR</span><span>{{esc .Error}}</span></div>{{end}}
  {{template "admin_text" dict "n" "name" "v" .Category.Name}}
  {{template "admin_area" dict "n" "description" "v" .Category.Description}}
  <div class="form-row">
    <label class="label" for="id_section">section</label>
    <select id="id_section" name="section">
      {{range $.Sections}}<option value="{{.ID}}"{{if eq .ID $.Category.SectionID}} selected{{end}}>{{esc .Name}}</option>{{end}}
    </select>
  </div>
  <div class="form-row"><label class="label" for="id_order">order</label><input type="number" id="id_order" name="order" value="{{.Category.Order}}"></div>
  <div class="form-row"><label class="label"><input type="checkbox" name="is_for_comments" value="1"{{if .Category.IsForComments}} checked{{end}}> holds article comments</label></div>
  <div class="action-row">
    <button type="submit" class="btn-primary">save</button>
    {{if .Category.ID}}<button type="submit" name="delete" value="1" class="btn-ghost">delete</button>{{end}}
    <a class="link-muted" href="{{esc .Back}}">back</a>
  </div>
</form>
{{end}}
