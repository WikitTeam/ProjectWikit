{{define "page_category_list.html"}}
<div class="btn-toolbar">
  <div class="btn-group"><a class="btn btn-primary" href="{{esc .New}}"><i class="fas fa-plus"></i>{{t "admin.new-category"}}</a></div>
</div>
<table class="table table-hover">
  <thead><tr><th>{{t "admin.f-name"}}</th><th>{{t "admin.f-indexed"}}</th><th>{{t "admin.f-articles"}}</th></tr></thead>
  <tbody>
    {{range .Categories}}
    <tr>
      <td><a href="{{esc $.Base}}{{.ID}}">{{esc .Name}}</a></td>
      <td>{{template "yes" .IsIndexed}}</td>
      <td class="num">{{.Articles}}</td>
    </tr>
    {{else}}
    <tr><td colspan="3" class="muted">{{t "admin.empty"}}</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
