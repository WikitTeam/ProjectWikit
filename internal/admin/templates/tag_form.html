{{define "tag_form.html"}}
{{template "form_error" .Error}}
<form method="POST" action="{{esc .Action}}">
  <input type="hidden" name="csrfmiddlewaretoken" value="{{esc .CSRF}}">
  <div class="widget-box narrow">
    <div class="widget-title"><i class="fas fa-tag"></i><h5>{{t "admin.tags"}}</h5></div>
    <div class="widget-content">
      {{template "row_text" dict "n" "name" "k" "admin.f-name" "v" .Tag.Name "w" "narrow-4"}}
      <div class="control-group">
        <label class="control-label" for="id_category">{{t "admin.f-category"}}</label>
        <div class="controls">
          <select id="id_category" name="category" class="narrow-3">
            <option value="">&mdash;</option>
            {{range $.Categories}}<option value="{{.ID}}"{{if eq (deref $.Tag.CategoryID) .ID}} selected{{end}}>{{esc .Name}}</option>{{end}}
          </select>
        </div>
      </div>
      {{template "save_row" dict "back" .Back "del" .Tag.ID}}
    </div>
  </div>
</form>
{{end}}
