{{define "forum_section_list.html"}}
<div class="btn-toolbar">
  <div class="btn-group"><a class="btn btn-primary" href="{{esc .New}}"><i class="fas fa-plus"></i>{{t "admin.new-section"}}</a></div>
</div>
<table class="table table-hover">
  <thead><tr><th>{{t "admin.f-name"}}</th><th>{{t "admin.f-order"}}</th><th>{{t "admin.f-hidden"}}</th><th>{{t "admin.f-categories"}}</th></tr></thead>
  <tbody>
    {{range .Sections}}
    <tr>
      <td><a href="{{esc $.Base}}{{.ID}}">{{esc .Name}}</a></td>
      <td class="num">{{.Order}}</td>
      <td>{{template "yes" .IsHidden}}</td>
      <td class="num">{{.Categories}}</td>
    </tr>
    {{else}}
    <tr><td colspan="4" class="muted">{{t "admin.empty"}}</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
