{{define "tag_category_list.html"}}
<div class="btn-toolbar">
  <div class="btn-group"><a class="btn btn-primary" href="{{esc .New}}"><i class="fas fa-plus"></i>{{t "admin.new-category"}}</a></div>
</div>
<table class="table table-hover">
  <thead><tr><th>{{t "admin.f-name"}}</th><th>{{t "admin.f-slug"}}</th><th>{{t "admin.f-priority"}}</th><th>{{t "admin.f-tags"}}</th></tr></thead>
  <tbody>
    {{range .Categories}}
    <tr>
      <td><a href="{{esc $.Base}}{{.ID}}">{{esc .Name}}</a></td>
      <td class="stamp">{{esc .Slug}}</td>
      <td class="num">{{num .Priority}}</td>
      <td class="num">{{.Tags}}</td>
    </tr>
    {{else}}
    <tr><td colspan="4" class="muted">{{t "admin.empty"}}</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
